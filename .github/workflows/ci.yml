name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-24.04

    services:
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports:
          - 6333:6333

    env:
      QDRANT_HOST: localhost
      QDRANT_PORT: "6333"
      COLLECTION_NAME: enterprise_rag_ci
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      LLM_MODEL: openai/gpt-oss-120b
      JWT_SECRET_KEY: ci-test-secret-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.docker.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.docker.txt
          python -m pip install pytest

      - name: Wait for Qdrant
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:6333/healthz > /dev/null; then
              echo "Qdrant is ready"
              break
            fi
            echo "Waiting for Qdrant..."
            sleep 2
          done

      - name: Initialize Qdrant
        run: |
          python -m scripts.init_qdrant

      - name: Compile application
        run: |
          python -m compileall app main.py scripts

      - name: Validate installed dependencies
        run: |
          python -m pip check

      - name: Run test suite
        run: |
          python -m pytest -q

  docker:
    name: Build Docker Images
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build backend image
        run: |
          docker build \
            --file Dockerfile \
            --tag enterprise-rag-backend:ci .

      - name: Build frontend image
        run: |
          docker build \
            --file Dockerfile.frontend \
            --tag enterprise-rag-frontend:ci .