name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    
    env:
      QDRANT_HOST: localhost
      QDRANT_PORT: "6333"
      COLLECTION_NAME: enterprise_rag_ci
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      LLM_MODEL: openai/gpt-oss-120b
      JWT_SECRET_KEY: ci-test-secret-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.docker.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.docker.txt
          python -m pip install pytest

      - name: Compile application
        run: |
          python -m compileall app main.py scripts

      - name: Validate installed dependencies
        run: |
          python -m pip check

      - name: Run test suite
        run: |
          python -m pytest -q

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            --file Dockerfile \
            --tag enterprise-rag-backend:ci .

      - name: Build frontend image
        run: |
          docker build \
            --file Dockerfile.frontend \
            --tag enterprise-rag-frontend:ci .