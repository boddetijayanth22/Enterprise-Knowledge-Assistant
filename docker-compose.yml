services:

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: enterprise-rag-qdrant
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-rag-backend:latest
    container_name: enterprise-rag-backend
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      HF_HOME: /app/data/huggingface
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - app_data:/app/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: enterprise-rag-frontend:latest
    container_name: enterprise-rag-frontend
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser/.streamlit:uid=1000,gid=1000,mode=700
    volumes:
      - frontend_data:/app/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  qdrant_data:
  app_data:
  frontend_data: